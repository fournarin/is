# The answer key for the evaluation manuals, written before the pipeline was
# run on them (ADR-096). Same schema as fixtures/corpus/manifest.yaml, plus a
# `split`: `dev` entries may be looked at while changing the pipeline, `test`
# entries are measured and never tuned on.
#
# Queries are phrased the way a technician would type them. Several carry no
# figures at all, because ADR-089's drafter chooses a page by the figures in the
# question, and a technician will not always type one.

version: 1

documents:
  - filename: sw-210-servo-gun.pdf
    sha256: 7f61493feeb40f521dbb524b35d682b661feb4c3298703ecf7f241d7283f35f8
    title: SW-210 Servo Spot Welding Gun - Maintenance
    machine_model: SW-210
    edition: Rev B, synthetic
    pages: 10
    lockout_page: 2
  - filename: sw-310-servo-gun.pdf
    sha256: f21fc30d2e63cfc87465e500b7ba31d41581181f48a46d1f2a8554cf6cca0ad7
    title: SW-310 Servo Spot Welding Gun - Maintenance
    machine_model: SW-310
    edition: Rev A, synthetic
    pages: 6
    lockout_page: 2
  - filename: cv-500-skid-conveyor.pdf
    sha256: 17796f08a03e372af582855fa7105d8bc1d833817646b29f49e070d487dddefb
    title: CV-500 Skid Conveyor - Maintenance
    machine_model: CV-500
    edition: Edition 2, synthetic
    pages: 9
    lockout_page: 2
  - filename: sd-30-sealer-dispenser.pdf
    sha256: d135719c5130bd267143b01c5f2427f3f66ec52d1a139707db3868705c4319a0
    title: SD-30 Sealer Dispensing Unit - Maintenance
    machine_model: SD-30
    edition: Edition 1, synthetic
    pages: 7
    lockout_page: 2

covered:
  - symptom_code: EV-101
    split: dev
    machine_model: SW-210
    answer_pages: [4]
    supporting_pages: [2, 3]
    required_skill: robot_mechanical
    estimated_minutes: 20
    correct_figures:
      tip_face_limit_mm: 7.5
      material_left_mm: 1.5
      alignment_mm: 0.5
      nugget_mm: 5
    distractors:
      - document: sw-310-servo-gun.pdf
        page: 3
        why: the sister model, same steps with 8 mm, 2 mm, 0.8 mm and 6 mm
      - page: 7
        why: the specification table repeats every figure and prescribes nothing
    queries:
      en: weld splash and small nuggets, the tips look worn
      th: หัวเชื่อมสึก เชื่อมแล้วสะเก็ดไฟกระเด็นเยอะ

  - symptom_code: EV-102
    split: test
    machine_model: SW-210
    answer_pages: [5]
    supporting_pages: [2]
    required_skill: robot_mechanical
    estimated_minutes: 30
    correct_figures:
      alarm_l_min: 4
      supply_bar: 3
      nominal_l_min: 6
      within_seconds: 30
    queries:
      en: weld gun cooling water flow alarm below 4 L/min
      th: น้ำหล่อเย็นหัวเชื่อมไหลน้อยกว่า 4 ลิตรต่อนาที

  - symptom_code: EV-103
    split: dev
    machine_model: SW-210
    answer_pages: [6]
    supporting_pages: [2]
    required_skill: robot_mechanical
    estimated_minutes: 45
    correct_figures:
      cover_bolts_nm: 8
      grease_g: 15
      test_strokes: 50
      settle_below_c: 70
    queries:
      en: servo gun motor temperature above 90 degrees
      th: มอเตอร์หัวเชื่อมร้อนเกิน 90 องศา

  - symptom_code: EV-104
    split: test
    machine_model: SW-210
    answer_pages: [9, 10]
    supporting_pages: [2]
    required_skill: electrical
    estimated_minutes: 60
    correct_figures:
      clamp_bolts_nm: 20
    queries:
      en: secondary weld cable jacket is cracked
      th: สายเคเบิลเชื่อมเปลือกแตก ต้องเปลี่ยนสาย

  - symptom_code: EV-111
    split: test
    machine_model: SW-310
    answer_pages: [3]
    supporting_pages: [2]
    required_skill: robot_mechanical
