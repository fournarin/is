    queries:
      en: sealer hose not heating, below 40 degrees
      th: ท่อส่งซีลเลอร์ไม่ร้อน อุณหภูมิต่ำกว่า 40 องศา

documented_without_procedure:
  - symptom_code: EV-105
    split: test
    machine_model: SW-210
    pages: [8]
    why: the troubleshooting page says the cause depends on the amplifier alarm
      and there is no field procedure
    queries:
      en: servo gun does not close fully
      th: หัวเชื่อมปิดไม่สุด

  - symptom_code: EV-125
    split: dev
    machine_model: CV-500
    pages: [7]
    why: roller noise has three possible causes and rollers are replaced by the
      service team, never repaired in the field
    queries:
      en: carrier roller making noise
      th: ลูกกลิ้งคอนเวเยอร์มีเสียงดัง

  - symptom_code: EV-134
    split: test
    machine_model: SD-30
    pages: [3]
    why: an irregular bead has too many causes for one procedure; the manual
      says to record it and ask the process engineer
    queries:
      en: sealer bead broken and irregular
      th: เส้นซีลเลอร์ขาดเป็นช่วง ๆ ไม่สม่ำเสมอ

absent:
  - symptom_code: EV-106
    split: dev
    machine_model: SW-210
    why: the controller's backup battery is in the robot controller manual, which
      is not in this corpus
    forbidden_phrases:
      - battery
    queries:
      en: robot controller backup battery low alarm
      th: แบตเตอรี่สำรองคอนโทรลเลอร์ต่ำ

  - symptom_code: EV-114
    split: test
    machine_model: SW-310
    why: a servo gun has no pneumatic equalizing cylinder; nothing in the corpus
      discusses one
    forbidden_phrases:
      - equaliz
    queries:
      en: air leaking from the gun equalizing cylinder
      th: ลมรั่วที่กระบอกสูบปรับสมดุลของหัวเชื่อม

  - symptom_code: EV-126
    split: test
    machine_model: CV-500
    why: network faults belong to the controls documentation, not this manual
    forbidden_phrases:
      - PLC
      - communication
    queries:
      en: conveyor zone PLC communication error
      th: คอนเวเยอร์ขึ้น error สื่อสารกับ PLC ไม่ได้

  - symptom_code: EV-135
    split: dev
    machine_model: SD-30
    why: the bead inspection camera is a separate system with its own manual
    forbidden_phrases:
      - camera
      - vision
    queries:
      en: bead inspection camera rejects good beads
      th: กล้องตรวจเส้นซีลเลอร์ reject ทั้งที่เส้นดี

