# Answer key for three MORE real manufacturer manuals (realdocs2).
# Written by Cowork on 2026-11-18 by reading the manuals, BEFORE the pipeline was run on them.
# The builder (Claude Code) must not edit an entry after seeing a result. If a page index is
# wrong because the pipeline numbers pages differently, fix ONLY the index mapping, say so in
# LOG.md, and do it before the first measured run.
#
# Pages are 1-based PDF page indices (pypdf order), not the printed page numbers. For
# 31978088.pdf the printed number equals the PDF index on the pages used here (checked with
# pypdf: 154, 157, 159, 243). For the two SMC PDFs, pdftotext order was used; pypdf crashed on
# om_mb2_doc1088008en.pdf (font encoding 90msp-RKSJ-H, UnicodeDecodeError) - if the pipeline's
# ingest also fails on it, that failure is itself a result: report it, then fix ingest so one
# bad page cannot sink a document, and measure again.
#
# Unlike the first realdocs set, two of these manuals DO prescribe field repair (seal
# replacement, oil-level check), so this set has `covered` entries: the owed outcome is a repair
# draft from the right page with the right figures.

version: 1

