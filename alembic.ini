# Alembic is used only to order migrations and record which have run (ADR-031).
# There are no models and autogenerate is never used: the schema depends on
# SKIP LOCKED, partial indexes, CHECK constraints and later BRIN and tsvector,
# none of which autogenerate can see.
[alembic]
script_location = migrations
prepend_sys_path = .
# sqlalchemy.url is filled from DATABASE_URL by migrations/env.py, so a DSN is
# never written to a file that gets committed.

[loggers]
keys = root,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARNING
handlers = console
qualname =
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
