# Seven containers, two networks (design.md 1, ADR-026, ADR-029).
#
# The network split is not an optimisation. ADR-003 forbids the LLM from
# generating repair instructions at runtime, and the import linter enforces that
# for calls made through a module. It cannot see a raw HTTP request. Putting
# llm-server on a network that api, web and worker-runtime are not members of
# makes runtime generation physically impossible rather than merely forbidden,
# and scripts/check_llm_isolation.py fails CI if that ever changes.
#
# Status: `api`, `worker-authoring` and `worker-runtime` run. worker-runtime now
# runs the trigger loop - signals in, Findings out, tickets issued (ADR-044) -
# and reads SYNTHETIC signals, because the plant has given us nothing to read
# yet; see the comment on its SIGNAL_SOURCE below before showing this to
# anybody. Layer 3 is not built, so the tickets it issues sit in the queue
# unassigned. `web` now serves the shell - signing in, and which screens a role
# is offered - and the screens themselves arrive in slices 10.2 to 10.5.

name: pdm

services:
  # ── data ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [app]
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.4
    volumes:
      - qdrant-data:/qdrant/storage
    networks: [app]
    restart: unless-stopped

  # ── schema ────────────────────────────────────────────────────────────
  # A one-shot container that runs the migrations and exits. Everything that
  # touches the database waits for it to finish successfully.
  #
  # Nothing did this before, so a fresh `docker compose up` produced an API
  # whose /health answered ok and whose login failed with `relation "account"
  # does not exist` - a service that looks up and is not, which is the failure
  # mode this project keeps refusing everywhere else.
  #
  # A separate service rather than an entrypoint step, so that a restart of the
  # API is not also a schema change, and so the log of what the schema did is in
  # one place.
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres: {condition: service_healthy}
    networks: [app]
    restart: "no"

  # ── application: one image, three roles (ADR-026) ─────────────────────
  api:
    build: .
    command: ["python", "-m", "pdm.api"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # The path is the mount below. There is no default in the code (ADR-019):
      # a service that starts against a guessed directory looks healthy while
      # writing documents somewhere nobody backs up.
      STORAGE_DIR: /app/storage
      # Same reasoning one store along: a worker pointed at no Qdrant indexes
      # manuals into nothing and reports success (ADR-035).
      QDRANT_URL: http://qdrant:6333
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_started}
      migrate: {condition: service_completed_successfully}
    volumes:
      - ./config:/app/config:ro
      - storage:/app/storage
    ports: ["8000:8000"]
    networks: [app]                                 # deliberately not [llm]
    restart: unless-stopped

  worker-runtime:
    build: .
    command: ["python", "-m", "pdm.workers.runtime"]
    # Shorter than the authoring worker's: the runtime jobs this will one day
    # claim are the ones a technician is waiting on, measured in seconds
    # (ADR-026), so there is nothing long to finish before stopping.
    stop_grace_period: 60s
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # The path is the mount below. There is no default in the code (ADR-019):
      # a service that starts against a guessed directory looks healthy while
      # writing documents somewhere nobody backs up.
      STORAGE_DIR: /app/storage
      # Same reasoning one store along: a worker pointed at no Qdrant indexes
      # manuals into nothing and reports success (ADR-035).
      QDRANT_URL: http://qdrant:6333
      # Layer 1's data. THIS IS INVENTED (ADR-032, ADR-044 section 5): every
      # work order this container issues describes a machine that is not there,
      # and the process says so at boot in a warning. It is set here because the
      # plant has not given us a signal connection and the whole project is
      # built so that nothing waits for one - not because synthetic is a
      # sensible default. Unset it and the worker reaps only; there is no
      # default in the code, deliberately.
      SIGNAL_SOURCE: ${SIGNAL_SOURCE:-synthetic}
      # 60x: the twelve-hour scenario is read in about twelve minutes, which is
      # one sitting (ADR-007). At 1.0 it runs at plant speed and the first
      # Finding arrives in about two hours.
      SIGNAL_SPEED: ${SIGNAL_SPEED:-60}
      # Where the `file` destination writes, if `policy.yaml` asks for it
      # (ADR-069). Unset here because the configured destination is
      # `own-system`, and there is no default in the code for the reason
      # STORAGE_DIR has none: a guessed directory is a worker that starts
      # healthy and writes tickets where nobody will look. Setting the
      # destination to `file` without this is a startup failure that says so.
      TICKET_DIR: ${TICKET_DIR:-}
      SIGNAL_SEED: ${SIGNAL_SEED:-0}
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    volumes:
      - ./config:/app/config:ro
      - storage:/app/storage
    networks: [app]                                 # deliberately not [llm]
    restart: unless-stopped

  worker-authoring:
    build: .
    command: ["python", "-m", "pdm.workers.authoring"]
    # SIGTERM makes the loop finish the job in hand rather than abandon it
    # (ADR-039), and Compose's default is to SIGKILL ten seconds later - which
    # would abandon every ingest ADR-017 puts at five to twenty minutes, exactly
    # the case the flag exists for. Twenty-five minutes covers the longest job
    # with room over the fifteen-minute dead threshold.
    stop_grace_period: 25m
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # The path is the mount below. There is no default in the code (ADR-019):
      # a service that starts against a guessed directory looks healthy while
      # writing documents somewhere nobody backs up.
      STORAGE_DIR: /app/storage
      # Same reasoning one store along: a worker pointed at no Qdrant indexes
      # manuals into nothing and reports success (ADR-035).
      QDRANT_URL: http://qdrant:6333
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_started}
      migrate: {condition: service_completed_successfully}
    volumes:
      - ./config:/app/config:ro
      - storage:/app/storage
    # The only service on both networks. ADR-017 keeps it at concurrency 1
    # because the work behind it is GPU-bound anyway.
    networks: [app, llm]
    restart: unless-stopped

  # ── models ────────────────────────────────────────────────────────────
  # Embedding and reranker models load in-process inside api and the workers,
  # because the extractive fallback is a runtime path (plan.md layer 2) and a
  # separate container for them would add a hop while preventing nothing.
  llm-server:
    image: ollama/ollama:0.5.7
    volumes:
      - llm-models:/root/.ollama
    # No `ports:` entry, and this is load-bearing rather than an omission:
    # publishing a port would expose the model on the host and let anything
    # reach it, which defeats the network split above.
    networks: [llm]
    restart: unless-stopped

  # ── frontend ──────────────────────────────────────────────────────────
  web:
    build: ./web
    environment:
      # Read by the Next server, never by the browser (ADR-058). The browser
      # only ever reaches this container, which calls the API for it - so the
      # address below is an internal one, no CORS configuration exists anywhere,
      # and moving the API does not mean rebuilding the image. A
      # NEXT_PUBLIC_ variable would have been compiled into the bundle at build
      # time and could do none of that.
      API_URL: http://api:8000
    depends_on: [api]
    ports: ["3000:3000"]
    networks: [app]                                 # deliberately not [llm]
    restart: unless-stopped

networks:
  app:
    driver: bridge
  llm:
    driver: bridge
    # internal: true would also cut llm-server off from the outside world, but
    # pulling a model needs egress on first run. Revisit once models are baked
    # into the image for the air-gapped factory install (git.md 7).

volumes:
  postgres-data:
  qdrant-data:
  llm-models:
  # Source documents. ADR-019: content-addressed, never deleted by the
  # application, and one of the two things that must be backed up.
  storage:
