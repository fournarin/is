name: ci

# Tier 0 of the test pyramid: structure and principles, not behaviour.
# It runs first because the most expensive invariants in this system
# (ADR-003, ADR-028, ADR-029) are structural checks that finish before the test
# suite has even installed its dependencies.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    name: tier 0 - structure and principles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: install
        run: uv sync --frozen

      - name: format + lint
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: type check
        run: uv run mypy

      - name: dependency rules (invariant 1, ADR-003)
        run: uv run lint-imports

      - name: configuration must be loadable (invariants 7 and 13)
        run: uv run python -m pdm.platform.config config

      - name: only the Clock port reads real time (invariant 14, ADR-028)
        run: uv run python scripts/check_no_wall_clock.py

      - name: the LLM is unreachable from runtime services (invariant 15, ADR-029)
        run: uv run python scripts/check_llm_isolation.py

      - name: unit tests
        run: uv run pytest

  image:
    name: tier 0 - the image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # One image serves api, worker-runtime and worker-authoring (ADR-026), so
      # a broken Dockerfile takes all three down at once. It is also the artefact
      # handed over for the on-premise install, where a build failure is found by
      # somebody else on a machine we cannot reach.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

# Steps to add once there is something for them to check. Do not add them early:
# a CI run that is red from day one is a CI run nobody reads
# (lessons_carried.md 4.4, and the table in git.md section 6.5).
#
#   test - split out of gate with a postgres service -> slice 1.3
