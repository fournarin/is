name: ci

# Tier 0 of the test pyramid: structure and principles, not behaviour.
# It runs first because the most expensive invariants in this system
# (ADR-003, ADR-028, ADR-029) are structural checks that finish before the test
# suite has even installed its dependencies.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    name: tier 0 - structure and principles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: install
        run: uv sync --frozen

      - name: format + lint
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: type check
        run: uv run mypy

      - name: dependency rules (invariant 1, ADR-003)
        run: uv run lint-imports

      - name: configuration must be loadable (invariants 7 and 13)
        run: uv run python -m pdm.platform.config config

      - name: only the Clock port reads real time (invariant 14, ADR-028)
        run: uv run python scripts/check_no_wall_clock.py

      - name: the LLM is unreachable from runtime services (invariant 15, ADR-029)
        run: uv run python scripts/check_llm_isolation.py

      - name: nothing in the application deletes a document (ADR-019)
        run: uv run python scripts/check_no_blob_deletion.py

      - name: unit tests (no database needed)
        run: uv run pytest -m "not db"

  test:
    name: tier 1 - behaviour, against a real PostgreSQL
    runs-on: ubuntu-latest
    # ADR-031 forbids substituting SQLite: what most needs testing in the queue
    # is exactly what SQLite lacks - SKIP LOCKED, partial indexes, CHECK
    # constraints - so a substitute would pass tests the real thing would fail.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pdm
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: pdm_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports: ["5432:5432"]
    env:
      DATABASE_URL: postgresql://pdm:ci@localhost:5432/pdm_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen

      - name: apply migrations
        run: uv run alembic upgrade head

      - name: database-backed tests
        run: uv run pytest -m db

  image:
    name: tier 0 - the image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # One image serves api, worker-runtime and worker-authoring (ADR-026), so
      # a broken Dockerfile takes all three down at once. It is also the artefact
      # handed over for the on-premise install, where a build failure is found by
      # somebody else on a machine we cannot reach.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

# Steps to add once there is something for them to check. Do not add them early:
# a CI run that is red from day one is a CI run nobody reads
# (lessons_carried.md 4.4, and the table in git.md section 6.5).
#
