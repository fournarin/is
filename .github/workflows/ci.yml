name: ci

# Tier 0 of the test pyramid: structure and principles, not behaviour.
# It runs first because the most expensive invariants in this system
# (ADR-003, ADR-028, ADR-029) are structural checks that finish before the test
# suite has even installed its dependencies.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    name: tier 0 - structure and principles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: install
        run: uv sync --frozen

      - name: format + lint
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: type check
        run: uv run mypy

      - name: dependency rules (invariant 1, ADR-003)
        run: uv run lint-imports

      - name: configuration must be loadable (invariants 7 and 13)
        run: uv run python -m pdm.platform.config config

      - name: only the Clock port reads real time (invariant 14, ADR-028)
        run: uv run python scripts/check_no_wall_clock.py

      - name: the LLM is unreachable from runtime services (invariant 15, ADR-029)
        run: uv run python scripts/check_llm_isolation.py

      - name: nothing in the application deletes a document (ADR-019)
        run: uv run python scripts/check_no_blob_deletion.py

      # In the Python job rather than the web one because it is a Python script
      # and needs no npm install to run. It is here at all because nothing else
      # in this file reads CSS: `next build` recovers from a broken stylesheet
      # rather than failing on it, so the web job stayed green for three and a
      # half weeks while the whole overview screen was unstyled.
      - name: every stylesheet rule is closed
        run: uv run python scripts/check_the_stylesheets_close_every_rule.py

      - name: every documentation link resolves
        run: uv run python scripts/check_doc_links.py

      - name: every configuration field is read by something
        run: uv run python scripts/check_config_is_read.py

      - name: unit tests (no database needed)
        run: uv run pytest -m "not db"

  test:
    name: tier 1 - behaviour, against a real PostgreSQL
    runs-on: ubuntu-latest
    # ADR-031 forbids substituting SQLite: what most needs testing in the queue
    # is exactly what SQLite lacks - SKIP LOCKED, partial indexes, CHECK
    # constraints - so a substitute would pass tests the real thing would fail.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pdm
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: pdm_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports: ["5432:5432"]
    env:
      DATABASE_URL: postgresql://pdm:ci@localhost:5432/pdm_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen

      - name: apply migrations
        run: uv run alembic upgrade head

      - name: database-backed tests
        run: uv run pytest -m db

  image:
    name: tier 0 - the image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # One image serves api, worker-runtime and worker-authoring (ADR-026), so
      # a broken Dockerfile takes all three down at once. It is also the artefact
      # handed over for the on-premise install, where a build failure is found by
      # somebody else on a machine we cannot reach.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: pdm:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building is not enough for this one. Docker copies the image's ownership
      # of a mount point onto a fresh named volume, and creates it root-owned if
      # the path does not exist in the image - so the container runs, looks
      # healthy, and fails at the first upload instead of at boot. Attaching a
      # new volume the way compose does is the only way to see it (ADR-019).
      - name: the document volume is writable by the runtime user (ADR-019)
        run: |
          docker run --rm \
            -v pdm-ci-storage:/app/storage \
            -e STORAGE_DIR=/app/storage \
            pdm:ci python -c "
          import os
          from pdm.platform.objects import FilesystemObjectStore, storage_root
          store = FilesystemObjectStore(storage_root())
          document_id = store.put(b'%PDF-1.7 synthetic')
          assert store.get(document_id) == b'%PDF-1.7 synthetic'
          print('stored', document_id, 'as uid', os.getuid())
          "

  web:
    name: tier 0 - the web app builds
    runs-on: ubuntu-latest
    # A job of its own, not a step in `gate`, so that a broken screen and a
    # broken rule engine are two different red lines. They are fixed by
    # different work and one must never hide the other.
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: install
        run: npm ci

      - name: lint
        run: npm run lint

      # Node 24 runs TypeScript directly, so `node --test` needs no framework
      # and no dependency. What it covers is the offline close queue, which is
      # the one piece of logic here that a person cannot check by looking at a
      # screen (ADR-062).
      - name: unit tests
        run: npm test

      # Before the type check on purpose. `next-env.d.ts` is generated and it
      # references the route types `next build` writes into .next/, so a
      # checkout that has never been built has nothing for tsc to read.
      - name: build
        run: npm run build

      - name: type check
        run: npm run typecheck

      # The same argument as the backend image one step up: the artefact handed
      # over for the on-premise install is the image, and a Dockerfile that only
      # ever builds on the author's laptop fails on a machine we cannot reach.
      # The context is `web/`, which is this job's working directory.
      - name: the image builds (ADR-029)
        run: docker build -t pdm-web:ci .

# Steps to add once there is something for them to check. Do not add them early:
# a CI run that is red from day one is a CI run nobody reads
# (lessons_carried.md 4.4, and the table in git.md section 6.5).
#
