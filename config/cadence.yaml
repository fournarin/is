# What counts as silence, and until when.
#
# scripts/check_the_loop_is_alive.py reads this, and a scheduled workflow runs
# that script. It exists because between 26 August and 18 September 2026 this
# repository received no work at all and nothing said so: the unattended loop
# had been disabled after a run hit a spending limit, and a disabled schedule
# leaves no failed run to read.
#
# Changing these values is the supported way to stand the alarm down. Turning
# the workflow off is not, and is the same act that cost twenty-three days.

# Hours of no commit on the default branch before the alarm fires.
#
# 72 rather than 48, and the reason is arithmetic rather than taste: Friday
# evening to Monday morning is 63 hours, so a two-day window fires every Monday
# and is switched off by the second one. Three days still catches a mid-week
# stop on its third morning, which is 20 days earlier than the gap this was
# written for was actually noticed.
quiet_hours_allowed: 72

# The last day on which a cadence is expected at all. Week 11 of the term ends
# on 22 October 2026 and week 12 is the feature freeze, so nothing after that
# date should be judged by how often a commit lands.
expected_until: 2026-10-22

# Printed by the check once the date above has passed, so that a run reading
# green says why rather than only saying green.
after_that: >-
  weeks 12 to 14 are the feature freeze and the report, and a quiet repository
  is what those weeks are supposed to look like.
