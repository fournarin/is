# The physical and organisational world: lines, stations, machines, skills, shifts.
#
# Provisional throughout. ADR-021 states this explicitly: the layout can be
# assumed and the work proceeds, and when the real buffer map arrives it changes
# values in this file and nothing else. Reporting sensitivity across several
# assumed layouts is worth more academically than one number from one real
# layout, so nothing here blocks on the plant.

version: 1

# Where the plant is. Shift boundaries below are local wall-clock times and every
# moment they are compared against is UTC (ADR-028, ADR-045 section 7). Read as
# UTC, the morning shift would start at one in the afternoon in the plant that is
# meant to be running it.
timezone: Asia/Bangkok

lines:
  - line_id: line-a
    # Seconds between units leaving the line. 60s is a placeholder standing for
    # "one vehicle a minute"; it converts downtime into lost units for the w2
    # term and has no source until the plant provides one.
    takt_seconds: 60.0

    stations:
      - station_id: st-01
        seq: 1
        # Twenty units queued ahead buys roughly twenty minutes at this takt.
        buffer_units: 20
        bottleneck_multiplier: 1.0
        machines:
          - machine_id: MC-001
            model: R-2000iC

      - station_id: st-02
        seq: 2
        buffer_units: 8
        bottleneck_multiplier: 1.0
        machines:
          - machine_id: MC-004
            model: R-2000iC

      # The case that makes ADR-021 worth having. No buffer and a bottleneck
      # multiplier: this station stops and the line stops with it. Scenarios must
      # cover both this and st-01 or the station-level w2 cannot be shown to
      # differ from a line-level constant.
      - station_id: st-03
        seq: 3
        buffer_units: 0
        bottleneck_multiplier: 3.0
        machines:
          - machine_id: MC-012
            model: R-2000iC

      - station_id: st-04
        seq: 4
        buffer_units: 12
        bottleneck_multiplier: 1.0
        machines:
          - machine_id: MC-018
            model: M-710iC

# The single skill vocabulary. Playbook.required_skill and Technician.skills both
# draw from this list and nothing else; two vocabularies would fail to match in
# silence, assigning work to the wrong people with nothing to show for it
# (ADR-027).
skills:
  - robot_mechanical
  - robot_controls
  - electrical
  - hydraulics

# Three shifts, the night one crossing midnight. That crossing is the reason
# every timestamp in this system is timezone-aware UTC: a naive datetime is wrong
# for exactly this shift and right for the other two (ADR-028).
shifts:
  - shift_id: morning
    starts_at: "06:00"
    ends_at: "14:00"
  - shift_id: afternoon
    starts_at: "14:00"
    ends_at: "22:00"
  - shift_id: night
    starts_at: "22:00"
    ends_at: "06:00"

# ── preventive maintenance ─────────────────────────────────────────────────
# The PM schedule: the second source of work (ADR-010), and the work a quiet
# shift is meant to absorb (ADR-011). A due task becomes a `scheduled` order
# through the same path every other ticket takes (ADR-083).
#
# **Every interval here needs a source, and the only one this project has is a
# manual.** `fixtures/corpus/pages.py`, the R-2000iC maintenance manual, page 5:
# "Replace the toothed belt at 8000 operating hours, or earlier if cracking is
# visible at the tooth root."
#
# 8000 *operating* hours is read here as 8000 hours of calendar time. Calendar
# hours are never fewer than operating hours, so the task falls due no later
# than the manual asks. It can fall due earlier - a machine stopped for a week
# still accrues calendar hours while the belt turns not at all - and ADR-083
# section 2 says what that costs. Counting real operating hours needs a signal
# nobody has agreed to send.
#
# There is nothing here for the M-710iC. Its manual states no interval, and an
# interval nobody wrote down is the kind of number this project refuses to
# invent. The health screen says so per machine rather than reading zero
# overdue as "nothing is due" (ADR-081).
pm_tasks:
  - pm_task_ref: pm-mc-001-toothed-belt
    machine_id: MC-001
    symptom_code: PM-toothed-belt
    interval_hours: 8000
  - pm_task_ref: pm-mc-004-toothed-belt
    machine_id: MC-004
    symptom_code: PM-toothed-belt
    interval_hours: 8000
  - pm_task_ref: pm-mc-012-toothed-belt
    machine_id: MC-012
    symptom_code: PM-toothed-belt
    interval_hours: 8000
