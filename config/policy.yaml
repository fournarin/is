# Tunable numbers: scoring weights, load gate, trigger timing, retrieval, fallbacks.
#
# Every constant in this project needs one of three provenances: a machine
# manual, a measurement of our own, or a recorded decision. Values here say which
# one they have. A number that looks reasonable but has no source is the same
# thing as a playbook nobody approved - it looks fine until somebody asks why.

version: 1

# ── scoring ────────────────────────────────────────────────────────────────
# Provenance: none of the three. These are starting values, and they are the one
# group in this file that must not be presented in the report as tuned. They are
# meant to be derived from the simulator and Loop 6, which replays real
# scheduling mistakes against alternative weights and reports the difference.
weights:
  severity: 1.0
  downtime: 1.0
  skill_match: 0.5
  waiting: 0.3
  # Only applies to Findings of kind "predicted". Work that has been forecast is
  # the best example of the lower-priority work a quiet shift should absorb.
  eta_urgency: 0.7

# ── load gate (ADR-011) ────────────────────────────────────────────────────
# Provenance: recorded decision. The advisor described this behaviour more
# concretely than any other part of the brief - heavy load means the important
# work first, light load means release the secondary work. Splitting it from the
# score keeps the explanation to one sentence a technician understands: "this
# shift is at 92%, four non-urgent jobs are being held".
#
# The two boundaries are starting values. 3E, a queueing model, is the tool for
# finding better ones; guessing again is not.
load:
  light_below: 0.5
  heavy_at_or_above: 0.8

# ── dispatch rounds (ADR-011, ADR-045) ─────────────────────────────────────
# Provenance: recorded decision, design.md 6.2, which sets the cadence at
# roughly five minutes and is in the repository at docs/from-the-working-notes.md.
# It is also the interval the simulator's scenarios already run at, so a
# comparison in slice 7.3 measures the same clock the plant would.
#
# The number is a trade between two costs, neither of which is a measurement:
# longer, and a critical fault waits for the next round before anybody is sent;
# shorter, and the queue re-ranks under technicians often enough that they stop
# reading it. Five minutes is short against a repair and long against a walk.
dispatch:
  round_seconds: 300
  # How long 3D's CP-SAT model may search (ADR-054). Provenance: recorded
  # decision, bounded by the round above. A round is 300 seconds and a solver
  # that could run for a whole one would leave the queue unranked until the
  # instant it is replaced; five seconds is a small fraction of that and, on the
  # scenarios measured here, an order of magnitude more than the model needs.
  # It is a ceiling, not a duration: an optimal answer stops the search.
  solver_seconds: 5.0
  # Who makes a round's decision real (ADR-071). Provenance: recorded decision -
  # the advisor was asked on 2026-08-23 who presses the button and answered that
  # a person should at first, and that automatic approval is something to
  # consider later once there is a record to judge it by.
  #
  # `supervisor` is the default because it is the mode that cannot lose work: a
  # plant that meant to review and got automatic dispatch finds out from a
  # technician who was sent somewhere nobody approved. `automatic` is the other
  # value, and it is the behaviour every record before ADR-071 assumed.
  confirmation: supervisor
  # How long a proposal waits for an answer before it returns to the queue.
  # Provenance: recorded decision, bounded by the round above and by the shift.
  # Longer than one round, so nothing is swept before a supervisor has had a
  # screen refresh to see it; far shorter than a shift, so nothing is confirmed
  # against a world eight hours old. Thirty minutes is six rounds.
  proposal_expires_minutes: 30

# ── triggers (ADR-020, ADR-023) ────────────────────────────────────────────
triggers:
  # Provenance: recorded decision. Without a cooldown a sensor oscillating across
  # its threshold produces Findings without end, which is the failure that would
  # otherwise destroy the system in its first hour on real data.
  cooldown_minutes: 30
  # How long past a predicted ETA to wait before calling the prediction expired.
  eta_grace_minutes: 60

  trend:
    # Provenance: none yet. To be set from measured ETA error on synthetic data,
    # which is the whole reason ADR-020 chose an approach that can be measured
    # without waiting for the plant.
    window_minutes: 120
    min_samples: 10
    # Predictions further out than this are not reported. Accuracy falls with
    # horizon, which is why ADR-020 requires error to be reported per horizon
    # rather than as one number that hides it.
    max_horizon_hours: 24

# ── what the finished jobs say the estimate should be (ADR-006, ADR-066) ───
# Provenance: recorded decision, both of them, and neither is a measurement -
# there is no manual that says how many closed jobs make a duration trustworthy.
# ADR-066 states the reasoning and is the record to revisit when this project has
# enough closed work to measure either.
estimates:
  # Below this many usable closed jobs, nothing is proposed. Five is the smallest
  # count that leaves two observations either side of the median, so one unusual
  # morning cannot be the middle. It is an argument about the statistic, not a
  # measurement of this plant, and it is deliberately on the cautious side: the
  # cost of waiting is a stale estimate, and the cost of moving too early is a
  # figure the scheduler prices every shift with.
  min_observations: 5
  # How far one proposal may move the estimate. ADR-022 set this bound, for the
  # oscillation it prevents: the estimate feeds load_ratio, load_ratio decides
  # which work is released, and which work is released decides which durations
  # come back. The schema refuses a larger value, so raising it is a new record
  # rather than an edit here.
  max_change_ratio: 0.20

# ── what the false alarms say a threshold should be (ADR-022, ADR-073) ─────
# Provenance: recorded decision, both of them, and ADR-073 is the record. They
# are deliberately not the two above, and section 4 of that record is the
# argument: a count that is enough to reprice a job is not enough to loosen a
# threshold layer 1 fires on.
thresholds:
  # Below this many closed orders behind a rule, nothing is proposed. Ten rather
  # than the five above, because a separating threshold is decided by the two
  # observations either side of it and every other order only says the boundary
  # is not somewhere else - and because of which loop can afford to be wrong.
  # A wrong estimate announces itself in the next batch of durations; a threshold
  # moved too far is a fault that no longer fires, and nothing here reports that.
  # The silent one gets the higher floor.
  min_observations: 10
  # How far one proposal may move a threshold, as a fraction of its magnitude.
  # Half of ADR-022's bound for durations, for that same asymmetry and because
  # rules.yaml says real thresholds come from the machine manuals: ten percent is
  # about as far as an argument built from ten work orders carries against a
  # document written by the people who built the machine. The schema refuses a
  # larger value, so raising it is a new record rather than an edit here.
  max_change_ratio: 0.10

# ── retrieval (ADR-015) ────────────────────────────────────────────────────
# Provenance: measured, but on somebody else's corpus. These come from the
# author's earlier on-premise RAG system and are starting points, not universal
# constants; they must be retuned on this project's own gold set before any
# number derived from them appears in the report.
# Thresholds are on the **fused** scale, which ADR-035 defines and which the two
# halves' own scores are not on: ts_rank_cd is unbounded and cosine similarity is
# dense around 0.8 for anything related. After fusion:
#
#   1.0   both halves ranked this first
#   ~0.98 both halves found it, both near the top
#   0.5   only one of the two halves found it at all
#
# A half that returns nothing still counts. That is what makes the number mean
# one thing - agreement between the halves - and it has two intended
# consequences. A Thai question with no figure in it, where the word half finds
# nothing at all (ADR-034), tops out at 0.5: authoring offers those and runtime
# abstains, which is exactly the split ADR-015 asks for. And if the vector store
# is down, every score halves and runtime abstains rather than serving word-only
# results as though both halves had agreed.
retrieval:
  # Recall leads here, because an engineer reviews every draft. Missing the right
  # manual page means that playbook never exists and nobody learns the gap was
  # there; pulling something irrelevant costs a reviewer a few seconds.
  #
  # Below 0.5, so a page only one half found is still offered.
  authoring:
    min_score: 0.20
    candidates: 40
    abstain: false

  # Precision leads here, because nothing stands between the system and the
  # technician. The review already happened, at approval time.
  #
  # Above 0.5 on purpose: where both halves had an opinion, they have to broadly
  # agree. The previous value of 0.35 sat below the score of a hit only one half
  # found, so the abstain gate ADR-015 requires could never fire - it read as
  # strict and admitted everything.
  runtime:
    min_score: 0.60
    safety_min_score: 0.75
    candidates: 8
    abstain: true

# ── fallback estimates (design.md 3.2) ─────────────────────────────────────
# Provenance: none. Deliberately coarse, and shown to the technician as coarse.
# Their purpose is not accuracy: without a duration a job cannot be queued at
# all, so long-tail work would disappear from the system with nothing reporting
# its absence.
fallback_minutes:
  R-2000iC:
    low: 30
    medium: 45
    high: 60
    critical: 90
  M-710iC:
    low: 25
    medium: 40
    high: 55
    critical: 80

# ── job queue timing (ADR-017, ADR-026) ────────────────────────────────────
# Provenance: recorded decision. Two sets, because one cannot serve both. A
# threshold tight enough to notice a dead five-second runtime job inside a minute
# would declare a twenty-minute manual ingest dead while it is still working, and
# a threshold loose enough for the ingest would leave the runtime queue stalled
# for that whole window. This is the consequence ADR-026 called out.
jobs:
  runtime:
    heartbeat_seconds: 10
    dead_after_seconds: 60
  authoring:
    heartbeat_seconds: 30
    # Fifteen minutes: the upper end of the 5-20 minute range ADR-017 gives for
    # ingest and drafting work, plus room for a slow model server.
    dead_after_seconds: 900

# ── where a placed ticket goes (ADR-012, ADR-069) ──────────────────────────
# Provenance: recorded decision. A name, and only a name. `own-system` puts the
# ticket where the technician's screen already reads it; `file` writes one JSON
# file per ticket into TICKET_DIR, which is set in the environment because a
# host path is a deployment fact rather than a plant policy (ADR-019's argument
# for STORAGE_DIR).
#
# `cmms` is the third and is deliberately not selected here. It is an adapter
# written against a contract of our own (ADR-070 section 2, ADR-074), and until
# somebody with access to the plant's work-order system confirms that contract,
# naming it here would point the plant at a host nobody has checked - the
# failure the paragraph below refuses, arriving by another route.
#
# A name this build does not have is a startup failure that says so, never a
# quiet fall back to own-system: a plant that configured `cmms` and got our own
# system would look like it was working, and the tickets nobody was reading
# would be the first anybody heard of it.
sinks:
  destination: own-system
